<title id="df-khb7d3-title">Payment lifecycle</title><desc id="df-khb7d3-desc">Owner&#39;s R&amp;D states lifecycle diagram. Nodes: Payment authorisation and fraud scoring orchestrator, Owner&#39;s queue a &lt; b, R&amp;D, Ok, Settlement reconciliation, ledger posting, regulatory reporting and archival of every completed payment batch overnight. Connections: Payment authorisation and fraud scoring orchestrator → Owner&#39;s queue a &lt; b (approved); Owner&#39;s queue a &lt; b → R&amp;D (batch); R&amp;D → Ok (done); Ok → Settlement reconciliation, ledger posting, regulatory reporting and archival of every completed payment batch overnight (archive).</desc>
