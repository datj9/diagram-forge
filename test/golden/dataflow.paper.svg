-linejoin="round" paint-order="stroke">features</text><path d="M900 248 C561 248, 561 498, 222 498" fill="none" stroke="#67726c" stroke-width="2.5" marker-end="url(#df-pphuj1-arrow)"/><text x="561" y="365" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#67726c" stroke="#fffdf8" stroke-width="4" stroke-linejoin="round" paint-order="stroke">scores</text><path d="M222 484 C291 484, 291 484, 360 484" fill="none" stroke="#67726c" stroke-width="2.5" marker-end="url(#df-pphuj1-arrow)"/><text x="291" y="476" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#67726c" stroke="#fffdf8" stroke-width="4" stroke-linejoin="round" paint-order="stroke">export</text><path d="M360 498 C291 498, 291 248, 222 248" fill="none" stroke="#67726c" stroke-width="2.5" marker-end="url(#df-pphuj1-arrow)"/><text x="291" y="365" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#67726c" stroke="#fffdf8" stroke-width="4" stroke-linejoin="round" paint-order="stroke">feedback</text><rect x="90" y="205" width="132" height="58" rx="13" fill="#fffdf8" stroke="#126b5a" stroke-width="2"/><circle cx="110" cy="234" r="6" fill="#126b5a"/><text x="125" y="239" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#17211d" font-weight="700" textLength="49.8" lengthAdjust="spacingAndGlyphs">Ingest</text><rect x="360" y="205" width="132" height="58" rx="13" fill="#fffdf8" stroke="#b4541f" stroke-width="2"/><circle cx="380" cy="234" r="6" fill="#b4541f"/><text x="395" y="239" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#17211d" font-weight="700" textLength="41.5" lengthAdjust="spacingAndGlyphs">Parse</text><rect x="630" y="205" width="132" height="58" rx="13" fill="#fffdf8" stroke="#7756b4" stroke-width="2"/><circle cx="650" cy="234" r="6" fill="#7756b4"/><text x="665" y="239" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#17211d" font-weight="700" textLength=