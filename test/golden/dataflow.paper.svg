<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="578" viewBox="0 0 1200 578" lang="en" xml:lang="en" role="img" aria-labelledby="df-pphuj1-title df-pphuj1-desc">
<title id="df-pphuj1-title">Event pipeline</title><desc id="df-pphuj1-desc">Six stages &amp; one sink dataflow diagram. Nodes: Ingest, Parse, Enrich, Score, Store, R&amp;D. Connections: Ingest → Parse (raw); Parse → Enrich (rows); Enrich → Score (features); Score → Store (scores); Store → R&amp;D (export); R&amp;D → Ingest (feedback).</desc>
<rect width="1200" height="578" fill="#f7f4ed"/><rect x="32" y="28" width="1136" height="522" rx="26" fill="#fffdf8" stroke="#c9d0c5"/>
<text x="76" y="92" font-family="Georgia, serif" font-size="34" fill="#17211d" font-weight="700">Event pipeline</text>
<text x="78" y="123" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#67726c">Six stages &amp; one sink</text>
