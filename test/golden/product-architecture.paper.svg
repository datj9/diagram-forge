<title id="df-2zitl4-title">Checkout platform</title><desc id="df-2zitl4-desc">An evidence-friendly system view with a presentation-grade finish architecture diagram. Nodes: Web app, Mobile app, Checkout API, Risk service, Orders DB, Event stream. Connections: Web app → Checkout API (HTTPS); Mobile app → Checkout API (HTTPS); Checkout API → Risk service (score); Checkout API → Orders DB (write); Checkout API → Event stream (publish).</desc>
