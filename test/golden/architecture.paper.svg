<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" lang="en" xml:lang="en" role="img" aria-labelledby="df-yzsspl-title df-yzsspl-desc">
<title id="df-yzsspl-title">Checkout &amp; payments platform</title><desc id="df-yzsspl-desc">Owner&#39;s view of the request path architecture diagram. Nodes: Web App, UI, Gateway, Postgres. Connections: Web App → Gateway (HTTPS); Gateway → Postgres (SQL &amp; cache); Web App → Postgres (direct); Postgres → Web App (owner&#39;s sync); Web App → UI (render).</desc>
