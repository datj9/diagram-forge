<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="536" viewBox="0 0 1200 536" lang="en" xml:lang="en" role="img" aria-labelledby="df-ccplt3-title df-ccplt3-desc">
<title id="df-ccplt3-title">Release &amp; approval workflow</title><desc id="df-ccplt3-desc">Owner&#39;s checklist workflow diagram. Nodes: Draft, Review, Sign-off, OK. Connections: Draft → Review (submit); Draft → Sign-off (fast &amp; loose); Sign-off → OK (ship).</desc>
<rect width="1200" height="536" fill="#f7f4ed"/><rect x="32" y="28" width="1136" height="480" rx="26" fill="#fffdf8" stroke="#c9d0c5"/>
<text x="76" y="92" font-family="Georgia, serif" font-size="34" fill="#17211d" font-weight="700">Release &amp; approval workflow</text>
<text x="78" y="123" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#67726c">Owner&#39;s checklist</text>
<defs><marker id="df-ccplt3-arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#67726c"/></marker></defs><text x="90" y="180" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4" fill="#126b5a">STEPS</text><text x="490" y="180" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4" fill="#b4541f">DONE</text><path d="M156 263 L156 309" fill="none" stroke="#67726c" stroke-width="2.5" marker-end="url(#df-ccplt3-arrow)"/><text x="172" y="290" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#67726c" stroke="#fffdf8" stroke-width="4" stroke-linejoin="round" paint-order="stroke">submit</text><path d="M222 234 H238 V442 H222" fill="none" stroke="#67726c" stroke-width="2.5" marker-end="url(#df-ccplt3-arrow)"/><text x="246" y="342" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#67726c" stroke="#fffdf8" stroke-width="4" stroke-linejoin="round" paint-order="stroke">fast &amp; loose</text><path d="M222 442 C356 442, 356 234, 490 234" fill="none" stroke="#67726c" stroke-width="2.5" marker-end="url(#df-ccplt3-arrow)"/><text x="356" y="330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#67726c" stroke="#fffdf8" stroke-width="4" stroke-linejoin="round" paint-order="stroke">ship</text><rect x="90" y="205" width="132" height="58" rx="13" fill="#fffdf8" stroke="#126b5a" stroke-width="2"/><circle cx="110" cy="234" r="6" fill="#126b5a"/><text x="125" y="239" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#17211d" font-weight="700" textLength="41.5" lengthAdjust="spacingAndGlyphs">Draft</text><rect x="90" y="309" width="132" height="58" rx="13" fill="#fffdf8" stroke="#126b5a" stroke-width="2"/><circle cx="110" cy="338" r="6" fill="#126b5a"/><text x="125" y="343" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#17211d" font-weight="700" textLength="49.8" lengthAdjust="spacingAndGlyphs">Review</text><rect x="90" y="413" width="132" height="58" rx="13" fill="#fffdf8" stroke="#126b5a" stroke-width="2"/><circle cx="110" cy="442" r="6" fill="#126b5a"/><text x="125" y="447" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#17211d" font-weight="700" textLength="66.4" lengthAdjust="spacingAndGlyphs">Sign-off</text><rect x="490" y="205" width="132" height="58" rx="13" fill="#fffdf8" stroke="#b4541f" stroke-width="2"/><circle cx="510" cy="234" r="6" fill="#b4541f"/><text x="525" y="239" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#17211d" font-weight="700" textLength="16.6" lengthAdjust="spacingAndGlyphs">OK</text></svg>